# own-reader 配置示例。复制为仓库根目录的 config.conf（已在 .gitignore 里），或用 OWN_READER_CONFIG 指向别处。
# 格式 KEY=VALUE，# 开头是注释。同名环境变量优先于这里。全部可省，省略即用右边的默认值。
# 这里不放任何密钥：各 AI 后端用它自己 CLI 已登录的凭据，或下面指向的 key 文件。

# ---- 路径 ----
# 事件库、缓存、画像文件所在目录（默认 ~/Library/Application Support/own-reader）
#OWN_READER_DATA=~/Library/Application Support/own-reader
# Calibre 书库目录（含 metadata.db；只读打开）。默认 ~/Calibre Library
#OWN_READER_CALIBRE=~/Calibre Library
# 监听端口（只绑 127.0.0.1）
#OWN_READER_PORT=8460

# ---- 选中提问的 AI 后端 ----
# 可选：local / free / claude / grok / kimi / gemini（见 server/llm.py）
#OWN_READER_DEFAULT_BACKEND=local
# 默认后端失败时自动改用的后端；留空 = 不回退
#OWN_READER_FALLBACK_BACKEND=
# local：任意 OpenAI 兼容服务的 base URL（llama.cpp 默认 :8080/v1，Ollama 是 :11434/v1）
#OWN_READER_LOCAL_LLM_URL=http://127.0.0.1:8080/v1
# local 用哪个模型；留空 = 取 /models 的第一个
#OWN_READER_LOCAL_LLM_MODEL=
# free：OpenRouter key 文件（只放 key 一行）与免费模型列表（逗号分隔，依次回退）
#OWN_READER_OPENROUTER_KEY_FILE=~/.config/openrouter/api-key.txt
#OWN_READER_FREE_MODELS=nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free,openrouter/free
# 各家官方 CLI 的路径；留空 = 先找 PATH，再找该 CLI 的常见安装位置
#OWN_READER_CLAUDE_BIN=
#OWN_READER_GROK_BIN=
#OWN_READER_KIMI_BIN=
#OWN_READER_AGY_BIN=
#OWN_READER_AGY_MODEL=gemini-3.8-flash-high

# ---- 荐书 / 书库评分 ----
#OWN_READER_RECS_BACKEND=claude
#OWN_READER_LIBRARY_BACKEND=claude
# 夜间增量重算用的后端（留空 = 同 LIBRARY_BACKEND）
#OWN_READER_RESCORE_BACKEND=
# 自定义类目表（格式见 taxonomy.example.json）
#OWN_READER_TAXONOMY=

# ---- 对照翻译 ----
# 后端顺序（逗号分隔）；mt_free = OpenRouter 免费档，mt_local = 本机 llama-server
#OWN_READER_TRANSLATE_CHAIN=mt_free,mt_local
#OWN_READER_TRANSLATE_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free
# mt_local：翻译用 GGUF 模型文件、llama-server 可执行文件、端口
#OWN_READER_MT_GGUF=~/models/translate.gguf
#OWN_READER_LLAMA_SERVER=llama-server
#OWN_READER_MT_PORT=8131

# ---- 可选集成（不设就跳过） ----
# 微信读书笔记 / 进度导入：agent gateway API key 文件
#OWN_READER_WEREAD_KEY_FILE=~/.config/weread/api-key.txt
# 另一个本机新闻阅读器的 HTTP 接口（接口约定见 server/recommend.py 的 pil_context）
#OWN_READER_NEWS_API=
# Home Cinema 的观看记录库（荐书时作辅助信号）
#OWN_READER_HOMECINEMA_DB=~/Library/Application Support/HomeCinema/library.db
